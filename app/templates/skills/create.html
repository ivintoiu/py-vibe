{% extends "base.html" %}

{% block title %}Create Skill - VibeDrive{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">Create New Skill</h1>

    <form method="POST" class="bg-white p-8 rounded-lg shadow space-y-6">
        <div>
            <label for="name" class="block text-gray-700 font-semibold mb-2">Skill Name *</label>
            <input type="text" id="name" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded">
        </div>

        <div>
            <label for="description" class="block text-gray-700 font-semibold mb-2">Description</label>
            <textarea id="description" name="description" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-6">
            <div>
                <label for="difficulty_level" class="block text-gray-700 font-semibold mb-2">Difficulty Level (1-5)</label>
                <input type="number" id="difficulty_level" name="difficulty_level" min="1" max="5" value="1" class="w-full px-4 py-2 border border-gray-300 rounded">
            </div>

            <div>
                <label for="estimated_hours" class="block text-gray-700 font-semibold mb-2">Estimated Hours</label>
                <input type="number" id="estimated_hours" name="estimated_hours" min="0" value="0" class="w-full px-4 py-2 border border-gray-300 rounded">
            </div>
        </div>

        <div class="flex space-x-4">
            <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded hover:bg-indigo-700">Create Skill</button>
            <a href="{{ url_for('dashboard.list_skills') }}" class="bg-gray-300 text-gray-900 px-6 py-2 rounded hover:bg-gray-400">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
