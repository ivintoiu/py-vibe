<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VibeDrive - Personal Learning Planner{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/tailwindcss@3/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        body, button, input, label, textarea, select {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-white text-gray-700">
    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200" style="box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);">
        <div style="max-width: 80rem; margin: 0 auto; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center; height: 4rem;">
            <!-- Left: Logo -->
            <div style="display: flex; align-items: center;">
                <a href="/" style="display: flex; align-items: center; gap: 0.5rem; text-decoration: none; white-space: nowrap;">
                    <i data-lucide="book-open" style="width: 24px; height: 24px; color: #3b82f6;"></i>
                    <span style="font-size: 1.25rem; font-weight: 600; color: #111827;">VibeDrive</span>
                </a>
            </div>

            <!-- Right: Navigation -->
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                {% if session.get('user_id') %}
                    <a href="{{ url_for('dashboard.list_skills') }}" style="color: #374151; text-decoration: none; font-weight: 500; font-size: 0.875rem; transition: color 0.15s ease-in-out;" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#374151'">Dashboard</a>
                    <span style="color: #d1d5db;">|</span>
                    <a href="{{ url_for('auth.logout') }}" style="color: #374151; text-decoration: none; font-weight: 500; font-size: 0.875rem; transition: color 0.15s ease-in-out;" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#374151'">Logout</a>
                {% else %}
                    <a href="{{ url_for('auth.login') }}" style="color: #374151; text-decoration: none; font-weight: 500; font-size: 0.875rem; transition: color 0.15s ease-in-out;" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#374151'">Login</a>
                    <span style="color: #d1d5db;">|</span>
                    <a href="{{ url_for('auth.register') }}" style="background-color: #3b82f6; color: white; text-decoration: none; font-weight: 500; font-size: 0.875rem; border-radius: 0.5rem; padding: 0.625rem 1rem; transition: background-color 0.15s ease-in-out;" onmouseover="this.style.backgroundColor='#2563eb'" onmouseout="this.style.backgroundColor='#3b82f6'">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Alerts -->
    {% if error %}
    <div style="background-color: #fef2f2; border-left: 3px solid #ef4444; padding: 1rem; margin: 1rem 1rem 0 1rem; border-radius: 0.5rem;">
        <p style="color: #991b1b; font-size: 0.875rem;">{{ error }}</p>
    </div>
    {% endif %}

    {% if message %}
    <div style="background-color: #f0fdf4; border-left: 3px solid #10b981; padding: 1rem; margin: 1rem 1rem 0 1rem; border-radius: 0.5rem;">
        <p style="color: #166534; font-size: 0.875rem;">{{ message }}</p>
    </div>
    {% endif %}

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center">
            <p style="color: #9ca3af; font-size: 0.875rem;">&copy; 2026 VibeDrive. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
