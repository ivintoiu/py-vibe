<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VibeDrive - Personal Learning Planner{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="bg-gray-50 text-gray-900">
    <!-- Navigation -->
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold text-indigo-600">VibeDrive</a>
                </div>
                <div class="flex items-center space-x-4">
                    {% if session.get('user_id') %}
                        <a href="{{ url_for('dashboard.list_skills') }}" class="text-gray-700 hover:text-indigo-600">Dashboard</a>
                        <a href="{{ url_for('auth.logout') }}" class="text-gray-700 hover:text-indigo-600">Logout</a>
                    {% else %}
                        <a href="{{ url_for('auth.login') }}" class="text-gray-700 hover:text-indigo-600">Login</a>
                        <a href="{{ url_for('auth.register') }}" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Register</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Alerts -->
    {% if error %}
    <div class="bg-red-50 border-l-4 border-red-400 p-4 m-4">
        <p class="text-red-700">{{ error }}</p>
    </div>
    {% endif %}

    {% if message %}
    <div class="bg-green-50 border-l-4 border-green-400 p-4 m-4">
        <p class="text-green-700">{{ message }}</p>
    </div>
    {% endif %}

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white shadow mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-gray-600">
            <p>&copy; 2024 VibeDrive. All rights reserved.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
