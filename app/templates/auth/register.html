{% extends "base.html" %}

{% block title %}Register - VibeDrive{% endblock %}

{% block content %}
<style>
    .register-form input {
        width: 100%;
        padding: 0.625rem 1rem;
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
        background-color: white;
        color: #111827;
        font-size: 0.875rem;
        transition: all 0.15s ease-in-out;
    }

    .register-form input:focus {
        outline: none;
        border-color: transparent;
        box-shadow: 0 0 0 2px #e0edff, 0 0 0 3px #3b82f6;
    }

    .register-button {
        width: 100%;
        background-color: #3b82f6;
        color: white;
        padding: 0.625rem 1rem;
        border-radius: 0.5rem;
        font-weight: 500;
        font-size: 0.875rem;
        border: none;
        cursor: pointer;
        transition: background-color 0.15s ease-in-out;
    }

    .register-button:hover {
        background-color: #2563eb;
    }

    .register-card {
        background-color: white;
        border: 1px solid #e5e7eb;
        border-radius: 0.75rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        padding: 2rem;
    }

    .register-centered {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
    }

    .register-branding {
        text-align: center;
        margin-bottom: 3rem;
    }

    .register-icon {
        width: 3rem;
        height: 3rem;
        color: #3b82f6;
        margin: 0 auto 1rem auto;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .register-title {
        font-size: 1.875rem;
        font-weight: 600;
        color: #111827;
    }

    .register-subtitle {
        color: #4b5563;
        font-size: 0.875rem;
        margin-top: 0.5rem;
    }
</style>

<div class="register-centered">
    <div style="width: 100%; max-width: 28rem;">
        <!-- Branding -->
        <div class="register-branding">
            <div class="register-icon">
                <i data-lucide="user-plus"></i>
            </div>
            <h1 class="register-title">Get Started</h1>
            <p class="register-subtitle">Create your VibeDrive account</p>
        </div>

        <!-- Card -->
        <div class="register-card">
            <form method="POST" class="register-form" style="display: flex; flex-direction: column; gap: 1.5rem;">

                <!-- Username -->
                <div>
                    <label for="username" style="display: block; font-size: 0.75rem; font-weight: 500; color: #374151; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        placeholder="Choose a username"
                        autocomplete="username"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label for="password" style="display: block; font-size: 0.75rem; font-weight: 500; color: #374151; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="Min 8 characters"
                        autocomplete="new-password"
                    >
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="password_confirm" style="display: block; font-size: 0.75rem; font-weight: 500; color: #374151; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
                        Confirm Password
                    </label>
                    <input
                        type="password"
                        id="password_confirm"
                        name="password_confirm"
                        required
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                    >
                </div>

                <!-- Submit Button -->
                <button type="submit" class="register-button">Create Account</button>

            </form>

            <!-- Divider -->
            <div style="position: relative; margin: 1.5rem 0;">
                <div style="position: absolute; inset: 0; display: flex; align-items: center;">
                    <div style="width: 100%; border-top: 1px solid #e5e7eb;"></div>
                </div>
                <div style="position: relative; display: flex; justify-content: center; font-size: 0.75rem;">
                    <span style="padding: 0 0.5rem; background-color: white; color: #6b7280;">Already have an account?</span>
                </div>
            </div>

            <!-- Login Link -->
            <a href="{{ url_for('auth.login') }}"
               style="display: block; width: 100%; border: 1px solid #e5e7eb; background-color: white; color: #374151; padding: 0.625rem 1rem; border-radius: 0.5rem; font-weight: 500; font-size: 0.875rem; text-align: center; transition: background-color 0.15s ease-in-out; text-decoration: none;"
               onmouseover="this.style.backgroundColor='#f9fafb';"
               onmouseout="this.style.backgroundColor='white';">
                Sign In
            </a>

        </div>

        <!-- Footer Text -->
        <p style="text-align: center; color: #9ca3af; font-size: 0.75rem; margin-top: 1.5rem;">
            By signing up, you agree to our Terms of Service and Privacy Policy
        </p>

    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (window.lucide) {
            lucide.createIcons();
        }
    });
</script>
{% endblock %}
