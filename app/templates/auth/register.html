{% extends "base.html" %}

{% block title %}Register - VibeDrive{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md bg-white p-8 rounded-lg shadow">
        <h2 class="text-3xl font-bold text-center mb-6">Register for VibeDrive</h2>

        <form method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-gray-700 font-semibold mb-2">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-indigo-600"
                    placeholder="Choose a username"
                >
            </div>

            <div>
                <label for="password" class="block text-gray-700 font-semibold mb-2">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-indigo-600"
                    placeholder="Min 8 characters"
                >
            </div>

            <div>
                <label for="password_confirm" class="block text-gray-700 font-semibold mb-2">Confirm Password</label>
                <input
                    type="password"
                    id="password_confirm"
                    name="password_confirm"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-indigo-600"
                    placeholder="Confirm your password"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-indigo-600 text-white font-semibold py-2 rounded hover:bg-indigo-700 transition"
            >
                Register
            </button>
        </form>

        <p class="text-center text-gray-600 mt-4">
            Already have an account?
            <a href="{{ url_for('auth.login') }}" class="text-indigo-600 hover:underline">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
