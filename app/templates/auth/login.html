{% extends "base.html" %}

{% block title %}Login - VibeDrive{% endblock %}

{% block content %}
<style>
.login-form input {
    width: 100%;
    padding: 0.625rem 1rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.5rem;
    background-color: white;
    color: #111827;
    font-size: 0.875rem;
    transition: all 0.15s ease-in-out;
}

.login-form input:focus {
    outline: none;
    border-color: transparent;
    box-shadow: 0 0 0 2px #e0edff, 0 0 0 3px #3b82f6;
}

.login-button {
    width: 100%;
    background-color: #3b82f6;
    color: white;
    padding: 0.625rem 1rem;
    border-radius: 0.5rem;
    font-weight: 500;
    font-size: 0.875rem;
    border: none;
    cursor: pointer;
    transition: background-color 0.15s ease-in-out;
}

.login-button:hover {
    background-color: #2563eb;
}

.login-card {
    background-color: white;
    border: 1px solid #e5e7eb;
    border-radius: 0.75rem;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    padding: 2rem;
}

.login-centered {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 1rem;
}

.login-branding {
    text-align: center;
    margin-bottom: 3rem;
}

.login-icon {
    width: 3rem;
    height: 3rem;
    color: #3b82f6;
    margin: 0 auto 1rem auto;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-title {
    font-size: 1.875rem;
    font-weight: 600;
    color: #111827;
}

.login-subtitle {
    color: #4b5563;
    font-size: 0.875rem;
    margin-top: 0.5rem;
}
</style>
<div class="login-centered">
    <div style="width: 100%; max-width: 28rem;">
        <!-- Branding -->
        <div class="login-branding">
            <div class="login-icon">
                <i data-lucide="book-open"></i>
            </div>
            <h1 class="login-title">Welcome back</h1>
            <p class="login-subtitle">Login to your learning journey</p>
        </div>

        <!-- Card -->
        <div class="login-card">
            <form method="POST" class="login-form" style="display: flex; flex-direction: column; gap: 1.5rem;">

                <!-- Username -->
                <div>
                    <label for="username" style="display: block; font-size: 0.75rem; font-weight: 500; color: #374151; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        placeholder="Enter your username"
                        autocomplete="username"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label for="password" style="display: block; font-size: 0.75rem; font-weight: 500; color: #374151; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                </div>

                <!-- Submit Button -->
                <button type="submit" class="login-button">Login</button>

            </form>

            <!-- Divider -->
            <div style="position: relative; margin: 1.5rem 0;">
                <div style="position: absolute; inset: 0; display: flex; align-items: center;">
                    <div style="width: 100%; border-top: 1px solid #e5e7eb;"></div>
                </div>
                <div style="position: relative; display: flex; justify-content: center; font-size: 0.75rem;">
                    <span style="padding: 0 0.5rem; background-color: white; color: #6b7280;">New here?</span>
                </div>
            </div>

            <!-- Register Link -->
            <a href="{{ url_for('auth.register') }}"
               style="display: block; width: 100%; border: 1px solid #e5e7eb; background-color: white; color: #374151; padding: 0.625rem 1rem; border-radius: 0.5rem; font-weight: 500; font-size: 0.875rem; text-align: center; transition: background-color 0.15s ease-in-out; text-decoration: none;"
               onmouseover="this.style.backgroundColor='#f9fafb';"
               onmouseout="this.style.backgroundColor='white';">
                Create an account
            </a>

        </div>

        <!-- Footer Text -->
        <p style="text-align: center; color: #9ca3af; font-size: 0.75rem; margin-top: 1.5rem;">
            By logging in, you agree to our Terms of Service and Privacy Policy
        </p>

    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (window.lucide) {
            lucide.createIcons();
        }
    });
</script>
{% endblock %}
