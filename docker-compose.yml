services:
  db:
    image: postgres:16-alpine
    container_name: py-vibe-db
    environment:
      POSTGRES_USER: pyvibe
      POSTGRES_PASSWORD: pyvibe
      POSTGRES_DB: pyvibe
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
