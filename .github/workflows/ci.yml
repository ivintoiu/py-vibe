name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Validate pre-commit config
        run: pre-commit validate-config

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Check if files were modified by pre-commit
        run: |
          if ! git diff --exit-code; then
            echo "❌ Code formatting issues detected. Please run 'pre-commit run --all-files' locally and commit the changes."
            echo "Files modified:"
            git diff --name-only
            exit 1
          fi

      - name: Test
        run: pytest tests/ -v
        env:
          JWT_SECRET: "ci-test-secret"
          SECRET_KEY: "ci-test-secret"
          DATABASE_URL: "postgresql://test:test@localhost:5432/vibedrive_test"
